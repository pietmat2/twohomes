name: Deploy site

# Publishes site/ on every push to main that touches it, and on demand from the
# Actions tab.
#
# Two targets, chosen by the repository variable DEPLOY_TARGET
# (Settings → Secrets and variables → Actions → Variables):
#
#   unset / "pages"  → GitHub Pages. Free, but Pages serves a PRIVATE repository
#                      only on a paid plan; on the free plan this fails at
#                      "Configure Pages" until the repository is public.
#   "cloudflare"     → Cloudflare Pages. Works with a private repository, free,
#                      and needs two secrets: CLOUDFLARE_API_TOKEN and
#                      CLOUDFLARE_ACCOUNT_ID.
#   "supabase"       → the Edge Function in supabase/functions/site, on the
#                      project that already runs the relay. Needs one secret,
#                      SUPABASE_ACCESS_TOKEN.
#
# site/README.md walks through both.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/build-site-function.mjs'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one half-way: a cancelled deploy can
# leave the live site on an older version.
concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  # Cheap smoke test. A missing stylesheet or a typo in a filename would
  # otherwise deploy quietly and leave an unstyled page up.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the site is whole
        run: |
          set -euo pipefail
          for f in index.html styles.css app.js stats.json favicon.svg; do
            test -s "site/$f" || { echo "::error::site/$f is missing or empty"; exit 1; }
          done
          for ref in styles.css app.js favicon.svg; do
            grep -q "$ref" site/index.html || { echo "::error::index.html does not reference $ref"; exit 1; }
          done
          for f in site/fonts/figtree-latin-wght-normal.woff2 site/fonts/figtree-latin-ext-wght-normal.woff2; do
            test -s "$f" || { echo "::error::$f is missing"; exit 1; }
          done
          # The page must stay self-contained: no font CDN, no script CDN.
          if grep -rqE 'https?://(fonts\.googleapis|fonts\.gstatic|cdn\.)' site/index.html site/styles.css; then
            echo "::error::site/ pulls from a third-party CDN; keep it self-hosted"; exit 1
          fi
          node -e "JSON.parse(require('fs').readFileSync('site/stats.json','utf8'))"
          node --check site/app.js
          echo "site/ looks deployable"

      # The edge-function bundle embeds site/, so a stale bundle would serve an
      # old page. Rebuild it and fail if the committed one differs.
      - name: Check the edge-function bundle matches site/
        run: |
          set -euo pipefail
          node scripts/build-site-function.mjs
          git diff --exit-code -- supabase/functions/site/index.ts \
            || { echo "::error::supabase/functions/site/index.ts is stale — run node scripts/build-site-function.mjs"; exit 1; }

      # Runs the function in Node and asks it for every asset, so a routing or
      # content-type mistake fails here rather than in production.
      - name: Serve the function locally and check every path
        run: node scripts/test-site-function.mjs

  # Publishes by pushing site/ to the gh-pages branch, which GitHub serves.
  #
  # Not actions/deploy-pages: that needs a Pages site, and creating one from a
  # workflow is refused on this repository — "Resource not accessible by
  # integration" on POST /repos/{repo}/pages, because GITHUB_TOKEN may not
  # create a Pages site here. Pushing a branch needs only contents: write, and
  # GitHub switched Pages on by itself when the branch first appeared.
  pages:
    needs: check
    if: vars.DEPLOY_TARGET != 'cloudflare' && vars.DEPLOY_TARGET != 'supabase'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Publish site/ to gh-pages
        run: |
          set -euo pipefail
          cd site
          # A stamp the liveness check can read back, so "it answers 200" cannot
          # be satisfied by the previous deploy still being served.
          echo '${{ github.sha }}' > version.txt
          git init -q .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Deploy ${{ github.sha }}"
          # The branch is a build output, not history: replace it every time.
          git push -q --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" \
            HEAD:gh-pages
          echo "pushed $(git rev-parse --short HEAD) to gh-pages"

      - name: Check the deployed page answers
        run: |
          set -euo pipefail
          repo='${{ github.repository }}'
          url="https://${{ github.repository_owner }}.github.io/${repo#*/}/"
          echo "checking $url"
          for i in $(seq 1 12); do
            code=$(curl -s -o page.html -w '%{http_code}' -L --max-time 20 "$url" || true)
            type=$(curl -s -o /dev/null -w '%{content_type}' -L --max-time 20 "$url" || true)
            stamp=$(curl -s -L --max-time 20 "${url}version.txt" | tr -d '[:space:]' || true)
            # Three things, not one: it answers, it answers as HTML, and what is
            # being served is THIS commit rather than the previous deploy.
            if [ "$code" = "200" ] && grep -q '<title>' page.html \
              && printf '%s' "$type" | grep -q '^text/html' \
              && [ "$stamp" = '${{ github.sha }}' ]; then
              echo "live: $url ($type, $stamp)"; exit 0
            fi
            echo "attempt $i: HTTP $code, type $type, stamp ${stamp:-none} — retrying"
            sleep 10
          done
          echo "::error::the deployed site did not serve this commit as 200 text/html"; exit 1

  cloudflare:
    needs: check
    if: vars.DEPLOY_TARGET == 'cloudflare'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Say which secrets are missing, before wrangler does
        run: |
          missing=
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::missing repository secret(s):$missing — see site/README.md"; exit 1
          fi

      # Idempotent: the first run creates the project, later runs say it exists.
      - name: Create the Pages project if it is not there yet
        run: |
          npx --yes wrangler@4 pages project create twohomes \
            --production-branch=main 2>&1 | tee create.log \
            || grep -qiE 'already exists|8000007' create.log \
            || { echo "::error::could not create the Pages project"; exit 1; }

      - name: Deploy
        run: npx --yes wrangler@4 pages deploy site --project-name=twohomes --branch=main

      - name: Check the deployed page answers
        run: |
          set -euo pipefail
          url=https://twohomes.pages.dev/
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o page.html -w '%{http_code}' -L --max-time 20 "$url" || true)
            type=$(curl -s -o /dev/null -w '%{content_type}' -L --max-time 20 "$url" || true)
            # The content type is checked too: a host that rewrites HTML to
            # text/plain serves 200 and is still not a website.
            if [ "$code" = "200" ] && grep -q '<title>' page.html \
              && printf '%s' "$type" | grep -q '^text/html'; then
              echo "live: $url ($type)"; exit 0
            fi
            echo "attempt $i: HTTP $code, type $type — retrying"; sleep 10
          done
          echo "::error::the deployed site did not answer with 200 text/html"; exit 1

  supabase:
    needs: check
    if: vars.DEPLOY_TARGET == 'supabase'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pack site/ into the function
        run: node scripts/build-site-function.mjs
      - name: Deploy the function
        run: |
          npx --yes supabase@latest functions deploy site \
            --project-ref aqkxpauandobwvjymxyl \
            --no-verify-jwt
      - name: Check the deployed page answers
        run: |
          set -euo pipefail
          url=https://aqkxpauandobwvjymxyl.supabase.co/functions/v1/site/
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/page -w '%{http_code}' -L --max-time 20 "$url" || true)
            [ "$code" = "200" ] && grep -q '<title>' /tmp/page && { echo "live: $url"; exit 0; }
            echo "attempt $i: HTTP $code, retrying"; sleep 6
          done
          echo "::error::the deployed site did not answer with 200"; exit 1
