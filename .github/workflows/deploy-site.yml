name: Deploy site

# Publishes site/ on every push to main that touches it, and on demand from the
# Actions tab.
#
# Two targets, chosen by the repository variable DEPLOY_TARGET
# (Settings → Secrets and variables → Actions → Variables):
#
#   unset / "pages"  → GitHub Pages. Free, but Pages serves a PRIVATE repository
#                      only on a paid plan; on the free plan this fails at
#                      "Configure Pages" until the repository is public.
#   "cloudflare"     → Cloudflare Pages. Works with a private repository, free,
#                      and needs two secrets: CLOUDFLARE_API_TOKEN and
#                      CLOUDFLARE_ACCOUNT_ID.
#   "supabase"       → the Edge Function in supabase/functions/site, on the
#                      project that already runs the relay. Needs one secret,
#                      SUPABASE_ACCESS_TOKEN.
#
# site/README.md walks through both.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one half-way: a cancelled deploy can
# leave the live site on an older version.
concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  # Cheap smoke test. A missing stylesheet or a typo in a filename would
  # otherwise deploy quietly and leave an unstyled page up.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the site is whole
        run: |
          set -euo pipefail
          for f in index.html styles.css app.js stats.json favicon.svg; do
            test -s "site/$f" || { echo "::error::site/$f is missing or empty"; exit 1; }
          done
          for ref in styles.css app.js favicon.svg; do
            grep -q "$ref" site/index.html || { echo "::error::index.html does not reference $ref"; exit 1; }
          done
          for f in site/fonts/figtree-latin-wght-normal.woff2 site/fonts/figtree-latin-ext-wght-normal.woff2; do
            test -s "$f" || { echo "::error::$f is missing"; exit 1; }
          done
          # The page must stay self-contained: no font CDN, no script CDN.
          if grep -rqE 'https?://(fonts\.googleapis|fonts\.gstatic|cdn\.)' site/index.html site/styles.css; then
            echo "::error::site/ pulls from a third-party CDN; keep it self-hosted"; exit 1
          fi
          node -e "JSON.parse(require('fs').readFileSync('site/stats.json','utf8'))"
          node --check site/app.js
          echo "site/ looks deployable"

      # The edge-function bundle embeds site/, so a stale bundle would serve an
      # old page. Rebuild it and fail if the committed one differs.
      - name: Check the edge-function bundle matches site/
        run: |
          set -euo pipefail
          node scripts/build-site-function.mjs
          git diff --exit-code -- supabase/functions/site/index.ts \
            || { echo "::error::supabase/functions/site/index.ts is stale — run node scripts/build-site-function.mjs"; exit 1; }

      # Runs the function in Node and asks it for every asset, so a routing or
      # content-type mistake fails here rather than in production.
      - name: Serve the function locally and check every path
        run: node scripts/test-site-function.mjs

  pages:
    needs: check
    if: vars.DEPLOY_TARGET != 'cloudflare'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

  cloudflare:
    needs: check
    if: vars.DEPLOY_TARGET == 'cloudflare'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=twohomes --branch=main

  supabase:
    needs: check
    if: vars.DEPLOY_TARGET == 'supabase'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pack site/ into the function
        run: node scripts/build-site-function.mjs
      - name: Deploy the function
        run: |
          npx --yes supabase@latest functions deploy site \
            --project-ref aqkxpauandobwvjymxyl \
            --no-verify-jwt
      - name: Check the deployed page answers
        run: |
          set -euo pipefail
          url=https://aqkxpauandobwvjymxyl.supabase.co/functions/v1/site/
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/page -w '%{http_code}' -L --max-time 20 "$url" || true)
            [ "$code" = "200" ] && grep -q '<title>' /tmp/page && { echo "live: $url"; exit 0; }
            echo "attempt $i: HTTP $code, retrying"; sleep 6
          done
          echo "::error::the deployed site did not answer with 200"; exit 1
